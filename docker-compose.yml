version: "3.9"
services:
  backend:
    build: ./server
    container_name: backend
    ports:
      - "8080:8080"
    volumes:
      - ./server:/app
    environment:
      - FLASK_APP=main.py
      - FLASK_RUN_HOST=0.0.0.0
      - FLASK_RUN_PORT=8080
      - MONGO_URI=mongodb://admin:secret@mongo:27017/
    depends_on:
      - mongo
    command: flask run --host=0.0.0.0 --port=8080

  frontend:
    build: ./twitch_sentiment
    container_name: frontend
    ports:
      - "5173:5173"
    volumes:
      - ./twitch_sentiment:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0

  mongo:
    image: mongo:6
    container_name: mongo
    ports:
      - "27017:27017"
    volumes:
      - ./mongo_data:/data/db
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=secret
